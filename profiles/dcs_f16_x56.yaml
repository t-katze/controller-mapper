profile:
  name: DCS_F16_X56
  version: 1
devices:
  x56_stick:
    match:
      name_contains: X56
      role: stick
  x56_throttle:
    match:
      name_contains: X56
      role: throttle
output:
  type: vjoy
  device_id: 1
global:
  update_rate_hz: 500
  gui_rate_hz: 30
modes:
  default: nav
  definitions:
  - nav
  - aa
  - ag
rules:
- name: roll
  mode: '*'
  input:
    device: x56_stick
    type: axis
    index: 0
  filters:
    deadzone: 0.03
    curve: 1.3
  output:
    type: axis
    name: x
- name: pitch
  mode: '*'
  input:
    device: x56_stick
    type: axis
    index: 1
  filters:
    deadzone: 0.03
    curve: 1.4
    invert: true
  output:
    type: axis
    name: y
- name: yaw_pedals
  mode: '*'
  input:
    device: x56_stick
    type: axis
    index: 2
  filters:
    deadzone: 0.05
    curve: 1.2
  output:
    type: axis
    name: rz
- name: throttle_main
  mode: '*'
  input:
    device: x56_throttle
    type: axis
    index: 0
  filters:
    deadzone: 0.01
    end_deadzone: 0.02
    smoothing: 0.05
  output:
    type: axis
    name: z
- name: noisy_button_fix
  mode: '*'
  input:
    device: x56_throttle
    type: button
    index: 12
  filters:
    debounce_ms: 50.0
    minimum_on_ms: 30.0
    minimum_off_ms: 30.0
  output:
    type: button
    index: 12
- name: slider_to_speedbrake
  mode: '*'
  input:
    device: x56_throttle
    type: axis
    index: 3
  transform:
    type: axis_to_button
    on_threshold: 0.65
    off_threshold: 0.5
  output:
    type: button
    index: 20
- name: rotary_to_two_buttons
  mode: '*'
  input:
    device: x56_throttle
    type: axis
    index: 4
  transform:
    type: axis_to_dual_button
    negative:
      output_button: 21
      on_threshold: -0.6
      off_threshold: -0.45
    positive:
      output_button: 22
      on_threshold: 0.6
      off_threshold: 0.45
  output:
    type: button
    index: 21
- name: button_to_brake_axis
  mode: '*'
  input:
    device: x56_stick
    type: button
    index: 5
  transform:
    type: button_to_axis
    released_value: 0.0
    pressed_value: 1.0
  output:
    type: axis
    name: slider1
- name: left_toe_brake
  mode: '*'
  input:
    device: x56_stick
    type: axis
    index: 2
  transform:
    type: axis_negative_to_button
    on_threshold: 0.65
    off_threshold: 0.5
  output:
    type: button
    index: 23
- name: gear_switch_split
  mode: '*'
  input:
    device: x56_throttle
    type: button
    index: 8
  transform:
    type: button_split
    on_button: 24
    off_button: 25
  output:
    type: button
    index: 24
- name: airbrake_extend
  mode: '*'
  input:
    device: x56_throttle
    type: button_pair
    index: 32
  filters:
    debounce_ms: 500.0
  output:
    type: button
    index: 0
