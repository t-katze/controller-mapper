profile:
  name: DCS_F16_X56
  version: 1
devices:
  x56_stick:
    match:
      name_contains: X56
      role: stick
  x56_throttle:
    match:
      name_contains: X56
      role: throttle
  t_rudder:
    match:
      name_contains: Rudder
      role: rudder
output:
  type: vjoy
  device_id: 1
global:
  update_rate_hz: 500
  gui_rate_hz: 30
modes:
  default: nav
  definitions:
  - nav
  - aa
  - ag
rules:
- name: airbrake
  mode: '*'
  input:
    device: x56_throttle
    type: button_pair
    index: 32
    negative_index: 0
    positive_index: 0
  filters:
    debounce_ms: 200.0
  transform:
    type: button_split
    on_button: 0
    off_button: 1
  output:
    type: button
    index: 0
- name: wheelbrake
  mode: '*'
  input:
    device: t_rudder
    type: axis
    index: 0
  transform:
    type: axis_to_button
    on_threshold: 0.5
    off_threshold: 0.4
  output:
    type: button
    index: 2
- name: wheelbrake_L
  mode: '*'
  input:
    device: t_rudder
    type: axis
    index: 1
  output:
    type: button
    index: 0
