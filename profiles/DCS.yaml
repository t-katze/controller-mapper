profile:
  name: DCS_F16_X56
  version: 1
output:
  type: vjoy
  device_id: 1
global:
  update_rate_hz: 500
  gui_rate_hz: 30
modes:
  default: nav
  definitions:
  - nav
  - aa
  - ag
rules:
- name: airbrake
  mode: '*'
  input:
    device: pygame_3
    type: button
    index: 32
  filters:
    debounce_ms: 100.0
  transform:
    type: button_split
    off_button: 1
  output:
    type: button
    index: 0
- name: wheelbrake_R
  mode: '*'
  input:
    device: pygame_0
    type: axis
    index: 0
  transform:
    type: axis_negative_to_button
    on_threshold: -0.5
    off_threshold: -0.5
    negative_direction: true
  output:
    type: button
    index: 2
- name: wheelbrake_L
  mode: '*'
  input:
    device: pygame_0
    type: axis
    index: 1
  transform:
    type: axis_negative_to_button
    on_threshold: -0.5
    off_threshold: -0.5
    negative_direction: true
  output:
    type: button
    index: 3
- name: stick_substick_x
  mode: '*'
  input:
    device: pygame_2
    type: axis
    index: 2
  filters:
    debounce_ms: 100.0
  transform:
    type: axis_to_dual_button
    negative:
      on_threshold: -0.7
      off_threshold: -0.7
    positive:
      on_threshold: 0.7
      off_threshold: 0.7
  output:
    type: button
    index: 4
    positive_index: 5
- name: stick_substick_y
  mode: '*'
  input:
    device: pygame_2
    type: axis
    index: 3
  filters:
    debounce_ms: 100.0
  transform:
    type: axis_to_dual_button
    negative:
      on_threshold: -0.7
      off_threshold: -0.7
    positive:
      on_threshold: 0.7
      off_threshold: 0.7
  output:
    type: button
    index: 6
    positive_index: 7
- name: hight_G_fwd_1
  mode: '*'
  input:
    device: pygame_2
    type: axis
    index: 1
  transform:
    type: axis_to_button
    on_threshold: 0.99
    off_threshold: 0.99
  output:
    type: button
    index: 9
- name: hight_G_fwd_2
  mode: '*'
  input:
    device: pygame_2
    type: axis
    index: 1
  transform:
    type: axis_to_button
    on_threshold: 0.99
    off_threshold: 0.99
  output:
    type: button
    index: 10
- name: hight_G_aft_1
  mode: '*'
  input:
    device: pygame_2
    type: axis
    index: 1
  transform:
    type: axis_negative_to_button
    on_threshold: -0.99
    off_threshold: -0.99
    negative_direction: true
  output:
    type: button
    index: 9
- name: hight_G_aft_2
  mode: '*'
  input:
    device: pygame_2
    type: axis
    index: 1
  transform:
    type: axis_negative_to_button
    on_threshold: -0.99
    off_threshold: -0.99
    negative_direction: true
  output:
    type: button
    index: 10
