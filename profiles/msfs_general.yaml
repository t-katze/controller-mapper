profile:
  name: MSFS_General
  version: 1
devices:
  joystick:
    match:
      role: stick
output:
  type: vjoy
  device_id: 1
global:
  update_rate_hz: 250
  gui_rate_hz: 30
modes:
  default: default
  definitions:
  - default
rules:
- name: roll
  mode: '*'
  input:
    device: joystick
    type: axis
    index: 0
  filters:
    deadzone: 0.05
    curve: 1.2
  output:
    type: axis
    name: x
- name: pitch
  mode: '*'
  input:
    device: joystick
    type: axis
    index: 1
  filters:
    deadzone: 0.05
    curve: 1.2
    invert: true
  output:
    type: axis
    name: y
- name: throttle
  mode: '*'
  input:
    device: joystick
    type: axis
    index: 2
  filters:
    deadzone: 0.02
    smoothing: 0.1
  output:
    type: axis
    name: z
- name: Stick 補助軸
  mode: '*'
  input:
    device: joystick
    type: axis
    index: 2
  filters:
    debounce_ms: 100.0
    deadzone: 0.5
  output:
    type: button
    index: 0
- name: Stick 補助軸 2
  mode: '*'
  input:
    device: joystick
    type: axis
    index: 3
  filters:
    debounce_ms: 100.0
    deadzone: 0.5
  output:
    type: button
    index: 1
