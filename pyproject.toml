[project]
name = "controller-mapper"
version = "0.1.0"
description = "Flight stick input correction and virtual controller output app"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "pygame-ce>=2.5.7",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
vjoy = ["pyvjoy>=1.0.1"]  # Windows only
build = ["pyinstaller>=6"]
test = ["pytest>=8"]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
controller-mapper = "controller_mapper.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
